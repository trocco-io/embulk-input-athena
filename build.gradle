plugins {
    id "org.embulk.embulk-plugins" version "0.5.5"
    id "com.github.jruby-gradle.base" version "1.5.0"
    id "java"
    id "checkstyle"
    // for task download
    id "de.undercouch.download" version "3.4.2"
    id "com.palantir.git-version" version "0.12.3"
}
import com.github.jrubygradle.JRubyExec
repositories {
    mavenCentral()
}
configurations {
    provided
}

version = {
    def vd = versionDetails()
    if (vd.commitDistance == 0 && vd.lastTag ==~ /^v[0-9]+\.[0-9]+\.[0-9]+-trocco-[0-9]+\.[0-9]+\.[0-9]+$/) {
        vd.lastTag.substring(1)
    } else {
        "0.0.0.${vd.gitHash}"
    }
}()

sourceCompatibility = 1.8
targetCompatibility = 1.8

dependencies {
    // version used in org.embulk:embulk-input-jdbc:0.12.2
    compileOnly "org.embulk:embulk-api:0.10.31"
    compileOnly "org.embulk:embulk-spi:0.10.31"
    compile("org.embulk:embulk-util-config:0.3.0")

    // TODO: maven...
    compile files ('build/AthenaJDBC41.jar')
    compile 'org.embulk:embulk-input-jdbc:0.12.2'
    testCompile "junit:junit:4.+"
}

task downloadFile(type: Download) {
    src 'https://s3.amazonaws.com/athena-downloads/drivers/JDBC/SimbaAthenaJDBC-2.0.23.1000/AthenaJDBC41.jar'
    dest buildDir
    onlyIfModified true
}

checkstyle {
    configFile = file("${project.rootDir}/config/checkstyle/checkstyle.xml")
    toolVersion = '6.14.1'
}
checkstyleMain {
    configFile = file("${project.rootDir}/config/checkstyle/default.xml")
    ignoreFailures = true
}
checkstyleTest {
    configFile = file("${project.rootDir}/config/checkstyle/default.xml")
    ignoreFailures = true
}
task checkstyle(type: Checkstyle) {
    classpath = sourceSets.main.output + sourceSets.test.output
    source = sourceSets.main.allJava + sourceSets.test.allJava
}


embulkPlugin {
    mainClass = "org.embulk.input.athena.AthenaInputPlugin"
    category = "input"
    type = "athena"
}

gem {
    dependsOn downloadFile

    from("LICENSE")
    authors = [ "shinji19" ]
    summary = "Athena input plugin for Embulk"
    description = "Loads records from Athena."
    homepage = "https://github.com/trocco-io/embulk-input-athena"
    licenses = [ "MIT" ]
}
